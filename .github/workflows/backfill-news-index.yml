name: backfill-news-index

on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install huggingface_hub pandas
      - run: python backfill_index.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ARCHIVE_TOKEN: ${{ secrets.HF_ARCHIVE_TOKEN }}
      - run: curl -X POST https://commentlens-api.onrender.com/reload_index
